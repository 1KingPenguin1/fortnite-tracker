<!DOCTYPE html>
<html>
<head>
    <title>Fortnite Chest Tracker</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background-color: #1f1f1f; display: inline-block; padding: 40px; border-radius: 15px; border: 2px solid #ffd700; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); }
        #count { font-size: 7rem; color: #00ffcc; font-weight: bold; margin: 20px; }
        button { background-color: #ffd700; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin: 5px; color: black; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Fortnite Chests Opened</h1>
        <div id="count">0</div>
        <button onclick="localStorage.setItem('fortniteChests', 0); document.getElementById('count').innerText = 0;">Reset</button>
    </div>
    <script>
        let chests = localStorage.getItem('fortniteChests') ? parseInt(localStorage.getItem('fortniteChests')) : 0;
        document.getElementById('count').innerText = chests;
        const broadcast = new BroadcastChannel('fortnite_chest_tracker');
        broadcast.onmessage = (event) => {
            if (event.data === 'add_chest') {
                chests = localStorage.getItem('fortniteChests') ? parseInt(localStorage.getItem('fortniteChests')) : 0;
                chests++;
                document.getElementById('count').innerText = chests;
                localStorage.setItem('fortniteChests', chests);
            }
        };
    </script>
</body>
</html>
